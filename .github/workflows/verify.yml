name: Verify source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Isolate generated research runs
        shell: python
        run: |
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('BRACE_RUNS_DIR='+str(Path(os.environ['RUNNER_TEMP'])/'brace-verification-runs')+'\n')
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: requirements-release.txt
      - run: python -m pip install -r requirements-release.txt
      - run: python scripts/check_repository.py
      - run: python tools/check_documentation.py
      - name: Verify installer version binding before tagging
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseVersion=(Get-Content -LiteralPath VERSION -Raw).Trim()
          $compiler=@('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files (x86)\Inno Setup 7\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 7\ISCC.exe') | Where-Object {Test-Path -LiteralPath $_} | Select-Object -First 1
          if(-not $compiler){throw 'Inno compiler required for version verification'}
          # Compile only the actual Setup directives, without application files or execution.
          $fixture=Join-Path $env:RUNNER_TEMP 'brace-version-smoke.iss'
          $settings=((Get-Content -LiteralPath packaging/windows.iss -Raw) -split '\[Files\]',2)[0]
          $settings=$settings -replace '(?m)^SourceDir=\.\.\r?$',('SourceDir='+(Get-Location).Path)
          [IO.File]::WriteAllText($fixture,$settings)
          & $compiler "/DBuildVersion=$releaseVersion" "/O$env:RUNNER_TEMP" '/Fbrace-version-smoke' $fixture
          if($LASTEXITCODE -ne 0){throw 'Installer version compiler smoke failed'}
          $info=(Get-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'brace-version-smoke.exe')).VersionInfo
          $numeric=@($info.FileMajorPart,$info.FileMinorPart,$info.FileBuildPart,$info.FilePrivatePart) -join '.'
          @{expected=$releaseVersion;file_version=$info.FileVersion;product_version=$info.ProductVersion;numeric_file_version=$numeric} | ConvertTo-Json -Compress | Write-Output
          if($info.FileVersion.Trim() -ne $releaseVersion -or $info.ProductVersion.Trim() -ne $releaseVersion -or $numeric -ne "$releaseVersion.0"){throw 'Installer version fields disagree with VERSION'}
      - run: python verify_release.py
      - run: python -m pytest -q
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.16.0
      - name: Verify workflow DOM handlers
        run: |
          npm install --prefix work/dom-test --no-save --no-audit --no-fund jsdom@31.0.0
          node tools/verify_workflow_dom.mjs
      - run: python scripts/release_smoke.py
