name: Build release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build
        required: true
        default: v1.1.0
      platforms:
        description: Windows first; select all for separately verified experimental builds
        type: choice
        options: [windows, all]
        default: windows
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms == 'all' && '["windows-latest","ubuntu-24.04","macos-15"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - name: Isolate generated research runs
        shell: python
        run: |
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('BRACE_RUNS_DIR='+str(Path(os.environ['RUNNER_TEMP'])/'brace-build-test-runs')+'\n')
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: |
            requirements-release.txt
            requirements-build.txt
      - run: python -m pip install -r requirements-release.txt -r requirements-build.txt
      - run: python verify_release.py
      - run: python scripts/check_repository.py
      - run: python -m pytest -q
      - run: python packaging/build.py
      - name: Verify Windows binary
        if: runner.os == 'Windows'
        run: python scripts/check_distribution.py dist/BRACE/BRACE.exe --output release-assets/WINDOWS_BINARY_VERIFICATION.json
      - name: Verify Windows real-data portability and restart
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/verify_portable.py --app dist/BRACE/BRACE.exe --out "${{ runner.temp }}/brace-portable-acceptance" --port 8877
          if($LASTEXITCODE -ne 0){throw 'Real-data portability check failed'}
          Copy-Item -LiteralPath "${{ runner.temp }}/brace-portable-acceptance/verification.json" -Destination release-assets/WINDOWS_PORTABLE_VERIFICATION.json
      - name: Verify Linux binary
        if: runner.os == 'Linux'
        run: python scripts/check_distribution.py dist/BRACE/BRACE --output release-assets/LINUX_BINARY_VERIFICATION.json
      - name: Verify macOS binary
        if: runner.os == 'macOS'
        run: python scripts/check_distribution.py dist/BRACE.app/Contents/MacOS/BRACE --output release-assets/MACOS_BINARY_VERIFICATION.json
      - name: Verify Windows native lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:BRACE_DATA_DIR=Join-Path $env:RUNNER_TEMP 'brace-native-controller'
          $env:BRACE_NO_BROWSER='1'
          $process=Start-Process -FilePath (Resolve-Path dist/BRACE/BRACE.exe) -ArgumentList '--launcher-self-test' -WindowStyle Hidden -Wait -PassThru
          if($process.ExitCode -ne 0){throw 'Native controller check failed'}
          Copy-Item -LiteralPath (Join-Path $env:BRACE_DATA_DIR 'launcher-self-test.json') -Destination release-assets/WINDOWS_NATIVE_LIFECYCLE.json
      - name: Compile and verify per-user Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler=@('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files (x86)\Inno Setup 7\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 7\ISCC.exe') | Where-Object {Test-Path -LiteralPath $_} | Select-Object -First 1
          if(-not $compiler){throw 'Inno Setup 6 is required; no unverified installer fallback'}
          & $compiler packaging/windows.iss
          if($LASTEXITCODE -ne 0){throw 'Installer compile failed'}
          $setup=(Get-ChildItem release-assets/*-setup.exe).FullName
          $destination=Join-Path $env:RUNNER_TEMP 'BRACE-installed-check'
          $process=Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="'+$destination+'"')) -WindowStyle Hidden -Wait -PassThru
          if($process.ExitCode -ne 0){throw 'Installer failed'}
          python scripts/check_distribution.py (Join-Path $destination 'BRACE.exe') --output release-assets/WINDOWS_INSTALLER_VERIFICATION.json
          if($LASTEXITCODE -ne 0){throw 'Installed app failed verification'}
          $process=Start-Process -FilePath (Join-Path $destination 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -WindowStyle Hidden -Wait -PassThru
          if($process.ExitCode -ne 0){throw 'Uninstall check failed'}
      - name: Record platform artifact checksums
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          root=Path('release-assets')
          names=sorted(p for p in root.iterdir() if p.is_file() and p.suffix in ('.zip','.exe','.json'))
          (root/'SHA256SUMS-${{ runner.os }}.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in names))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brace-${{ runner.os }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
  draft:
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Add exact tagged source archive
        run: git archive --format=zip --prefix=BRACE/ --output=release-assets/BRACE-source.zip HEAD
      - name: Checksum the exact source archive
        run: sha256sum release-assets/BRACE-source.zip > release-assets/SHA256SUMS-source.txt
      - name: Publish the verified Windows release
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --latest --title "BRACE ${RELEASE_TAG#v}" --notes-file docs/release/RELEASE_BODY.md release-assets/*
