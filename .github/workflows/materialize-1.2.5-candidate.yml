name: Materialize exact 1.2.5 candidate
on:
  push:
    branches: [feat/workbench-1.2.5]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/workbench-1.2.5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Generate existing inventories and require the reviewed source tree
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item -LiteralPath '.github/workflows/materialize-1.2.5-candidate.yml'
          python tools/audit_ui_strings.py
          if($LASTEXITCODE -ne 0){throw 'Inventory generation failed'}
          python scripts/seal_source.py
          if($LASTEXITCODE -ne 0){throw 'Source sealing failed'}
          python verify_release.py
          if($LASTEXITCODE -ne 0){throw 'Source integrity failed'}
          git add -A
          $tree=(git write-tree).Trim()
          if($tree -ne 'a876aa21a3715dccd04526e4bbbb7c28efda2e3b'){throw "Generated tree does not match the reviewed local candidate: $tree"}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize reviewed BRACE 1.2.5 inventories; remove one-time workflow'
          if($LASTEXITCODE -ne 0){throw 'Commit failed'}
          git push origin HEAD:refs/heads/feat/workbench-1.2.5
          if($LASTEXITCODE -ne 0){throw 'Branch update failed'}
